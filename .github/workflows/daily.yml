name: KRX 수급 → 텔레그램

on:
  schedule:
    - cron: "30 9 * * 1-5"   # UTC 09:30 = KST 18:30 (시간외 종료 후), 평일
  workflow_dispatch:          # Actions 탭에서 수동 실행 (시연용)
    inputs:
      date:
        description: "기준일 YYYYMMDD (비우면 최근 영업일)"
        required: false

permissions:
  contents: write             # 수집한 CSV 를 repo 에 커밋

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 수집 + 발송
        env:
          DATE: ${{ inputs.date }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}   # 선택
          HF_TOKEN: ${{ secrets.HF_TOKEN }}                   # 선택
          HF_REPO: ${{ vars.HF_REPO }}                        # 선택 (예: myname/krx-flows)
        run: python collect.py $DATE

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%F)"
          git push
